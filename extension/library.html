<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>B站字幕库</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; margin: 0; background: #f5f6f7; }
    header { background: #00a1d6; color: #fff; padding: 14px 20px; font-size: 18px; display: flex; align-items: center; gap: 12px; }
    header .count { font-size: 13px; opacity: .85; }
    .wrap { max-width: 860px; margin: 20px auto; padding: 0 16px; }
    .empty { text-align: center; color: #999; padding: 60px 0; font-size: 14px; line-height: 2; }
    .item { background: #fff; border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); display: flex; align-items: center; gap: 12px; }
    .item .info { flex: 1; min-width: 0; }
    .item .t { font-size: 14px; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .m { font-size: 12px; color: #999; margin-top: 3px; }
    .item button { border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
    .btn-exp { background: #e8f4fb; color: #00a1d6; }
    .btn-del { background: #fdeaea; color: #d64545; margin-left: 6px; }
    .tip { color: #888; font-size: 12px; line-height: 1.8; }
  </style>
</head>
<body>
  <header>📚 B站字幕库 <span class="count" id="count"></span></header>
  <div class="wrap">
    <div id="list"></div>
    <div id="empty" class="empty" style="display:none">
      还没有任何字幕<br>
      打开一个没有字幕的B站视频 → 点左下角「字幕」胶囊 → 「生成字幕」
    </div>
    <div class="tip" style="margin-top:16px">
      字幕保存在浏览器本地（重启不丢）。卸载插件或清除扩展数据会删除全部字幕，重要字幕请先「导出」成 .srt 文件备份。
    </div>
  </div>
  <script src="shared-subs.js"></script>
  <script src="library.js"></script>
</body>
</html>
